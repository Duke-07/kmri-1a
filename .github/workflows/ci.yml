name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend-build:
    name: Frontend Build & Asset Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run Vite production build
        run: npm run build

  python-engine:
    name: Python Engine Verification & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn pytest

      - name: Run pipeline dry-run diagnostic
        run: |
          python scripts/run_pipeline.py --mode dry-run

      - name: Execute automated test suite
        run: |
          pytest tests/
