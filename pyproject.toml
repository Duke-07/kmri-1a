[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-regime-detection-engine"
version = "1.5.1"
description = "Bayesian Regime Detection Engine for Indian Equity Markets with Calibrated Uncertainty"
readme = "README.md"
authors = [
  { name = "Aaryan Dwivedi", email = "71445760+Duke-07@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
  "quantitative-finance",
  "regime-detection",
  "bayesian-inference",
  "conformal-prediction",
  "nifty-50",
  "hmm",
  "bocpd"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
